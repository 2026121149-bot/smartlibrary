
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management | SmartLibrary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-brand">
            <img src="images/assets/uitm-logo.jpg" alt="UiTM Logo">
            <span>SmartLibrary</span>
        </div>

        <small class="menu-label">MAIN MENU</small>

        <nav class="sidebar-menu">

            <a href="dashboard.html">
                <i class="bi bi-grid"></i> Dashboard
            </a>

            <a href="books.html" class="active">
                <i class="bi bi-book"></i> Book Management
            </a>

            <a href="borrowing.html">
                <i class="bi bi-arrow-left-right"></i> Borrow & Return
            </a>

            <a href="history.html">
                <i class="bi bi-clock-history"></i> Transaction History
            </a>

            <a href="payment.html">
                <i class="bi bi-wallet2"></i> Fine & Payment
            </a>

            <a href="profile.html">
                <i class="bi bi-person"></i> My Profile
            </a>

        </nav>

        <button id="logoutBtn" class="logout-button">
            <i class="bi bi-box-arrow-left"></i> Logout
        </button>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h3 class="fw-semibold mb-1">Book Management</h3>
                <p class="text-muted small mb-0">
                    Explore and manage library books.
                </p>
            </div>

            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-person-circle fs-3"></i>
                <span id="headerName">Student</span>
            </div>

        </header>


        <!-- CATALOGUE HEADER -->
        <section class="card content-card mb-4">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h5 class="fw-semibold mb-0">Book Catalogue</h5>

                <button class="btn btn-primary"
                    id="addBookBtn"
                    data-bs-toggle="modal"
                    data-bs-target="#bookModal">

                    <i class="bi bi-plus-lg"></i> Add Book

                </button>

            </div>


            <!-- SEARCH AND FILTER -->
            <div class="row g-3">

                <div class="col-md-8">

                    <div class="input-group">

                        <span class="input-group-text bg-white">
                            <i class="bi bi-search"></i>
                        </span>

                        <input type="search"
                            id="searchBook"
                            class="form-control"
                            aria-label="Search books"
                            placeholder="Search by title, author or ISBN...">

                    </div>

                </div>

                <div class="col-md-4">

                    <select id="categoryFilter" class="form-select" aria-label="Filter by category">

                        <option value="">All Categories</option>
                        <option value="Information Systems">Information Systems</option>
                        <option value="Database">Database</option>
                        <option value="Project Management">Project Management</option>
                        <option value="Research">Research</option>
                        <option value="Information Science">Information Science</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="Others">Others</option>

                    </select>

                </div>

            </div>

        </section>


        <!-- BOOK CARDS -->
        <div class="row g-4" id="bookList">

            <div class="col-12 text-center text-muted py-5">

                <i class="bi bi-book fs-1"></i>
                <p class="mt-3">No books available yet.</p>

            </div>

        </div>

        <footer class="text-center text-muted small mt-4">
            &copy; 2026 SmartLibrary. Student Project.
        </footer>

    </main>


    <!-- ADD / EDIT BOOK MODAL -->
    <div class="modal fade" id="bookModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">

        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title" id="modalTitle">
                        Add New Book
                    </h5>

                    <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    </button>

                </div>

                <form id="bookForm">

                    <div class="modal-body">

                        <input type="hidden" id="bookId">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="bookTitle" class="form-label">Book Title</label>
                                <input type="text" id="bookTitle"
                                    class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label for="bookAuthor" class="form-label">Author</label>
                                <input type="text" id="bookAuthor"
                                    class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label for="bookISBN" class="form-label">ISBN</label>
                                <input type="text" id="bookISBN"
                                    class="form-control" required>
                            </div>

                            <div class="col-md-6">

                                <label for="bookCategory" class="form-label">Category</label>

                                <select id="bookCategory"
                                    class="form-select" required>

                                    <option value="">Select Category</option>
                                    <option value="Information Systems">Information Systems</option>
                                    <option value="Database">Database</option>
                                    <option value="Project Management">Project Management</option>
                                    <option value="Research">Research</option>
                                    <option value="Information Science">Information Science</option>
                                    <option value="Data Analytics">Data Analytics</option>
                                    <option value="Others">Others</option>

                                </select>

                            </div>

                            <div class="col-md-6">
                                <label for="bookLocation" class="form-label">Shelf Location</label>
                                <input type="text" id="bookLocation"
                                    class="form-control"
                                    placeholder="Example: A-01" required>
                            </div>

                            <div class="col-md-6">
                                <label for="bookQuantity" class="form-label">Quantity</label>
                                <input type="number" id="bookQuantity"
                                    class="form-control"
                                    min="1" value="1" required>
                            </div>

                            <div class="col-12">

                                <label for="bookCover" class="form-label">Book Cover</label>

                                <input type="file"
                                    id="bookCover"
                                    class="form-control"
                                    accept="image/png,image/jpeg,image/webp">

                                <div class="form-text">
                                    Upload a JPG, PNG or WEBP image.
                                </div>

                            </div>

                            <div class="col-12 text-center">

                                <img id="coverPreview"
                                    class="rounded d-none"
                                    alt="Book cover preview"
                                    width="120">

                            </div>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button type="button"
                            class="btn btn-light"
                            data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Save Book
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/demo-data.js"></script>
<script src="js/script.js"></script>

</body>
</html>
