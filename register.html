
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SmartLibrary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <!-- Left Panel -->
        <section class="login-left">

            <div class="login-brand">
                <img src="images/assets/uitm-logo.jpg" alt="UiTM Logo" class="university-logo">
                <span>SmartLibrary</span>
            </div>

            <div class="illustration-container">
                <img src="images/assets/b3.jpg" alt="Student reading" class="student-illustration">
            </div>

            <div class="welcome-content">
                <h1>Start your learning journey.</h1>
                <p>Discover academic resources and explore new knowledge.</p>
            </div>

            <div class="left-footer">
                Your digital campus library.
            </div>

        </section>

        <!-- Right Panel -->
        <section class="login-right">

            <div class="login-form-container">

                <div class="login-icon">
                    <i class="bi bi-person-plus"></i>
                </div>

                <h2>Create an account.</h2>
                <p class="text-muted small">Join SmartLibrary today.</p>

                <div id="registerError" class="alert alert-danger d-none" role="alert"></div>
                <div id="registerSuccess" class="alert alert-success d-none" role="status"></div>

                <form id="registerForm">

                    <div class="mb-3">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control" placeholder="Enter full name" required>
                    </div>

                    <div class="mb-3">
                        <label for="studentId" class="form-label">Student ID</label>
                        <input type="text" id="studentId" class="form-control" placeholder="Enter student ID" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Student Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter student email" required>
                    </div>

                    <div class="mb-3">
                        <label for="faculty" class="form-label">Faculty</label>
                        <input type="text" id="faculty" class="form-control" placeholder="Enter faculty" required>
                    </div>

                    <div class="mb-3">
                        <label for="programme" class="form-label">Programme</label>
                        <input type="text" id="programme" class="form-control" placeholder="Enter programme" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>

                        <div class="custom-input">
                            <i class="bi bi-lock"></i>
                            <input type="password" id="password" placeholder="Create password" minlength="6" autocomplete="new-password" required>

                            <button type="button" id="togglePassword" class="password-toggle" aria-label="Show or hide password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" autocomplete="new-password" required>
                    </div>

                    <button type="submit" class="login-button">
                        Create Account
                        <i class="bi bi-arrow-right"></i>
                    </button>

                </form>

                <div class="register-link">
                    Already have an account?
                    <a href="index.html">Sign In</a>
                </div>

                <div class="login-footer">
                    &copy; 2026 SmartLibrary. Student Project.
                </div>

            </div>

        </section>

    </main>

    <script src="js/demo-data.js"></script>
<script src="js/script.js"></script>

</body>
</html>
